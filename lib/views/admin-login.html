<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <title>Logg inn på adminkonsollen | Nordheim Larssen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/login.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Hopp til innhold</a>
  <header class="admin-header wrap">
    <a class="brand" href="/no/" aria-label="Nordheim Larssen, hjem"><img class="light-logo" src="/images/brand/primary-light.svg" width="248" height="38" alt=""><img class="dark-logo" src="/images/brand/primary-dark.svg" width="248" height="38" alt=""></a>
    <a class="quiet-link" href="/no/">Til nettsiden <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" class="login-layout wrap">
    <div class="login-copy">
      <h1>Logg inn på<br><span>adminkonsollen</span></h1>
      <button class="button" id="login-button" type="button">Logg inn med GitHub</button>
      <p class="login-note">Kun kontoen din har tilgang.</p>
      <p class="notice" id="login-message" role="status" hidden></p>
      <noscript><p>JavaScript må være på for å bruke adminkonsollen.</p></noscript>
    </div>
    <div class="login-art" aria-hidden="true">
      <div class="art-laptop"><div class="art-screen"><span class="terminal-prompt">&gt;_</span><span class="terminal-cursor"></span></div><div class="art-base"></div></div>
      <div class="art-mini"><img src="/images/brand/symbol-light.svg" alt=""></div>
      <div class="art-shadow"></div>
    </div>
  </main>
  <footer class="admin-footer wrap"><span>Nordheim Larssen</span><span>Adminkonsoll</span></footer>
</body>
</html>
