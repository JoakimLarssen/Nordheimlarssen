<!doctype html>
<!--
  nordheimlarssen.no :: 404. Served by Vercel for any not-found path.
  Same dossier design system as the home: self-contained, zero JavaScript,
  all CSS inlined, Google Fonts the only external request. The masthead and
  footer match the home so a missing path still lands inside the dossier.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0C0B">
<meta name="robots" content="noindex">
<meta name="description" content="Page not found. This path is not part of the dossier.">
<meta name="author" content="Joakim Nordheim Larssen">
<title>404 · Not found · Joakim Nordheim Larssen</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================
   404, in the dossier voice.
   Reuses the home design system verbatim: same tokens, same
   masthead and footer, same framed terminal exhibit. A quiet
   oversized 404 as the typographic mark; one accent, spent on
   the prompt glyph. Zero JavaScript.
   ============================================================ */

:root{
  --bg:      #0B0C0B;
  --fg-hi:   #F2F3F0;
  --fg:      #C6CAC5;
  --dim:     #8A908B;
  --ghost:   #3B403C;
  --hair:    #1E211F;
  --line:    #2C302D;
  --acc:     #57C97B;
  --refuse:  #D07C6E;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  --t-name:    clamp(2rem, 1.15rem + 2.9vw, 3.7rem);
  --t-sect:    clamp(1.2rem, 1.05rem + .55vw, 1.45rem);
  --t-body:    1rem;
  --t-small:   .8125rem;
  --t-label:   .6875rem;

  --maxw: 1280px;
  --marg: 13rem;
  --mgap: clamp(2.5rem, 4vw, 4rem);
  --gut: clamp(20px, 4.5vw, 56px);
  --ease: cubic-bezier(.22,.61,.36,1);
}

*{ box-sizing:border-box; margin:0; padding:0 }
html{ color-scheme:dark }
body{
  background:var(--bg);
  color:var(--fg);
  font:400 15px/1.65 var(--mono);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-variant-numeric: tabular-nums;
  min-height:100vh;
  display:flex; flex-direction:column;
}

::selection{ background:var(--fg-hi); color:var(--bg) }

a{
  color:var(--fg-hi);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-decoration-color:rgba(242,243,240,.32);
  text-underline-offset:.24em;
  transition: text-decoration-color .12s var(--ease), color .12s var(--ease);
}
a:hover{ text-decoration-color:var(--fg-hi) }

:focus-visible{
  outline:2px solid var(--fg-hi);
  outline-offset:3px;
  border-radius:1px;
}

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gut) }

.sr{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

.skip{
  position:absolute; left:var(--gut); top:-48px;
  background:var(--fg-hi); color:var(--bg);
  padding:8px 14px; font-size:var(--t-small); font-weight:500;
  text-decoration:none; z-index:10;
  transition: top .12s var(--ease);
}
.skip:focus{ top:10px }

/* ---------- masthead (matches home) ---------- */

.site-head{ border-bottom:1px solid var(--hair) }
.site-head .wrap{
  display:flex; align-items:center; justify-content:space-between;
  height:3.5rem;
}
.brand{
  font-size:.9375rem; font-weight:600; color:var(--fg-hi);
  text-decoration:none; letter-spacing:.01em;
}
.brand .tilde{ color:var(--dim); font-weight:400 }
.site-nav{ display:flex; gap:1.7rem }
.site-nav a{
  font-size:var(--t-small); color:var(--dim); text-decoration:none;
}
.site-nav a:hover{ color:var(--fg-hi); text-decoration:underline;
  text-decoration-thickness:1px; text-underline-offset:.24em }

/* ---------- the 404 section ---------- */

main{ flex:1 1 auto; display:flex; align-items:center }
main section{ width:100%; padding:56px 0 64px }

.sgrid{ display:block }
.marg{
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:1px solid var(--hair);
  padding-bottom:10px; margin-bottom:20px;
}
.m-idx{
  font-size:var(--t-label); letter-spacing:.16em; color:var(--dim);
  order:2;
}
.m-path{ font-size:.75rem; color:var(--dim); letter-spacing:.02em }
.m-note{ display:none }

.kicker{
  font-size:var(--t-label); font-weight:500;
  letter-spacing:.3em; text-transform:uppercase;
  color:var(--dim);
  margin-bottom:16px;
}

/* the big quiet mark: the ghost numeral, given hero scale */
.nf-num{
  font:600 clamp(5.5rem, 3.4rem + 14vw, 14rem)/.92 var(--mono);
  color:var(--ghost);
  letter-spacing:-.02em;
  margin:2px 0 8px -.02em;
}

/* framed terminal exhibit, same family as the home exhibits */
.fig{ margin:26px 0 0; max-width:30rem }
.frame{ border:1px solid var(--line); background:#0D0F0E }
.fbar{
  display:flex; justify-content:space-between; gap:1rem;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  font-size:var(--t-label); letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim);
}
.fbar span:first-child{ white-space:nowrap }
.fbar-r{ white-space:nowrap }
.term{
  padding:15px 16px 17px;
  font:400 13px/1.62 var(--mono);
  color:var(--fg);
  overflow-x:auto;
}
.term p{ overflow-wrap:break-word }
.term > * + *{ margin-top:.32em }
.t-in{
  color:var(--fg-hi);
  padding-left:1.7ch; text-indent:-1.7ch;
}
.t-in .glyph{ color:var(--acc); font-weight:700; margin-right:.7ch }
.t-notice{
  color:var(--dim);
  border-left:1px solid var(--line);
  padding-left:1.1ch;
}

.nf-line{
  margin-top:28px;
  font:400 1.0625rem/1.65 var(--sans);
  color:var(--fg);
  max-width:44ch;
}

.nf-links{ margin-top:22px; display:flex; flex-wrap:wrap; gap:2.5ch }
.nf-links a{ font-size:var(--t-small); font-weight:500 }

/* ---------- footer (matches home) ---------- */

.site-foot{ border-top:1px solid var(--hair) }
.site-foot .wrap{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:1.5rem; flex-wrap:wrap;
  padding-top:26px; padding-bottom:44px;
  font-size:.75rem; color:var(--dim);
}
.site-foot .src{ letter-spacing:.08em }

/* ============================================================
   DESKTOP >= 1020px: the marginalia column, same as the home.
   ============================================================ */

@media (min-width:1020px){
  main section{ padding:80px 0 88px }

  .sgrid{
    display:grid;
    grid-template-columns:var(--marg) minmax(0,1fr);
    column-gap:var(--mgap);
    align-items:start;
  }
  .marg{
    display:block;
    border-bottom:0; padding-bottom:0; margin-bottom:0;
  }
  .m-idx{
    font-size:2.6rem; font-weight:600; line-height:1;
    letter-spacing:.01em; color:var(--ghost);
    order:0;
  }
  .m-path{ margin-top:12px }
  .m-note{
    display:block;
    margin-top:28px;
    font:400 var(--t-small)/1.6 var(--sans);
    color:var(--dim);
    max-width:11.5rem;
  }
  .m-note .sx{
    display:block;
    font:500 var(--t-label)/1 var(--mono);
    letter-spacing:.16em; text-transform:uppercase;
    margin-bottom:7px;
  }
}

/* ============================================================
   MOBILE <= 740px
   ============================================================ */

@media (max-width:740px){
  body{ font-size:14px }
  .site-nav{ gap:1.1rem }
  .site-nav a{ font-size:.75rem }

  main section{ padding:40px 0 44px }
  .marg{ margin-bottom:16px }
  .fig{ margin-top:20px }
  .term{ padding:13px 13px 15px }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation:none !important;
    transition:none !important;
  }
  .skip{ transition:none }
}
</style>
</head>
<body id="top">

<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/"><span class="tilde">~/</span>jnl</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/#projects">projects</a>
      <a href="/#ctf">ctf.log</a>
      <a href="/writing">writing</a>
      <a href="/cv">cv</a>
      <a href="/#contact">contact</a>
    </nav>
  </div>
</header>

<main id="main">
  <section aria-labelledby="h-404">
    <div class="wrap sgrid">
      <div class="marg">
        <p class="m-idx" aria-hidden="true">~/</p>
        <p class="m-path" aria-hidden="true">404 · not found</p>
        <p class="m-note"><span class="sx" aria-hidden="true">note</span>The requested path is not part of this dossier. The links below return to the record.</p>
      </div>
      <div>
        <p class="kicker">HTTP 404</p>
        <h1 class="nf-num" id="h-404" aria-label="404, page not found">404</h1>

        <figure class="fig">
          <div class="frame">
            <p class="fbar" aria-hidden="true"><span>error</span><span class="fbar-r">not found</span></p>
            <div class="term" role="group" aria-label="Terminal reading the requested path">
              <p class="t-in"><span class="glyph" aria-hidden="true">$</span>cat $REQUEST_URI</p>
              <p class="t-notice">cat: no such file or directory</p>
            </div>
          </div>
        </figure>

        <p class="nf-line">This page is not in the record.</p>

        <nav class="nf-links" aria-label="Back to the site">
          <a href="/">home</a>
          <a href="/writing">writing</a>
          <a href="/cv">cv</a>
        </nav>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>© 2026 Joakim Nordheim Larssen</p>
    <p class="src">no JavaScript · no analytics</p>
  </div>
</footer>

</body>
</html>
