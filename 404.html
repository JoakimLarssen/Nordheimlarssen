<!doctype html>
<!--
  nordheimlarssen.no :: 404. Served by Vercel for any not-found path.
  Same dossier design system as the home: self-contained, zero JavaScript,
  all CSS inlined, Google Fonts the only external request. The masthead and
  footer match the home so a missing path still lands inside the dossier.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0C0B">
<meta name="robots" content="noindex">
<meta name="description" content="Page not found. This path is not part of the dossier.">
<meta name="author" content="Joakim Nordheim Larssen">
<title>404 | Not found | Joakim Nordheim Larssen</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================
   404, in the dossier voice.
   Reuses the home design system: same tokens, same masthead and
   footer, same framed terminal exhibit. One quiet oversized 404
   as the typographic mark, centred so the composition resolves.
   One accent, spent on the prompt glyph. Zero JavaScript.
   ============================================================ */

:root{
  --bg:      #0B0C0B;
  --fg-hi:   #ECECEC;
  --fg:      #DDDDDD;
  --dim:     #CECECE;
  --ghost:   #3B403C;
  --hair:    #1E211F;
  --line:    #2C302D;
  --acc:     #57C97B;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  --t-small:   .8125rem;
  --t-label:   .6875rem;

  --maxw: 1280px;
  --gut: clamp(20px, 4.5vw, 56px);
  --ease: cubic-bezier(.22,.61,.36,1);
}

*{ box-sizing:border-box; margin:0; padding:0 }
html{ color-scheme:dark }
body{
  background:var(--bg);
  color:var(--fg);
  font:400 15px/1.65 var(--mono);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-variant-numeric: tabular-nums;
  min-height:100vh;
  display:flex; flex-direction:column;
}

::selection{ background:var(--fg-hi); color:var(--bg) }

a{
  color:var(--fg-hi);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-decoration-color:rgba(242,243,240,.32);
  text-underline-offset:.24em;
  transition: text-decoration-color .12s var(--ease), color .12s var(--ease);
}
a:hover{ text-decoration-color:var(--fg-hi) }

:focus-visible{
  outline:2px solid var(--fg-hi);
  outline-offset:3px;
  border-radius:5px;
}

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gut) }

.sr{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

.skip{
  position:absolute; left:var(--gut); top:-48px;
  background:var(--fg-hi); color:var(--bg);
  border-radius:5px;
  padding:8px 14px; font-size:var(--t-small); font-weight:500;
  text-decoration:none; z-index:10;
  transition: top .12s var(--ease);
}
.skip:focus{ top:10px }

/* ---------- masthead (matches home) ---------- */

.site-head{ border-bottom:1px solid var(--hair) }
.site-head .wrap{
  display:flex; align-items:center; justify-content:space-between;
  height:3.5rem;
}
.brand{
  font-size:.9375rem; font-weight:600; color:var(--fg-hi);
  text-decoration:none; letter-spacing:.01em;
}
.brand .tilde{ color:var(--dim); font-weight:400 }
.site-nav{ display:flex; gap:1.7rem }
.site-nav a{
  font-size:var(--t-small); color:var(--dim); text-decoration:none;
}
.site-nav a:hover{ color:var(--fg-hi); text-decoration:underline;
  text-decoration-thickness:1px; text-underline-offset:.24em }

/* ---------- the 404 section: one centred, resolved block ---------- */

main{ flex:1 1 auto; display:flex; align-items:center }
main section{ width:100%; padding: clamp(48px, 9vh, 104px) 0 }

.nf{ max-width:34rem; margin:0 auto; text-align:center }

/* the big quiet mark: an outlined ghost numeral, drawn clean so
   the 0 is a plain ring with no stray centre dot */
.nf-num{
  display:block;
  width:clamp(230px, 42vw, 468px);
  height:auto;
  margin:0 auto;
  color:#616663;
}

.nf-line{
  margin-top: clamp(22px, 3.2vh, 34px);
  font:400 1.0625rem/1.65 var(--sans);
  color:var(--fg);
}

/* framed terminal exhibit, same family as the home exhibits */
.fig{ margin: clamp(26px, 3.8vh, 42px) auto 0; max-width:30rem; text-align:left }
.frame{ border:1px solid var(--line); border-radius:5px; background:#0D0F0E }
.fbar{
  display:flex; justify-content:space-between; gap:1rem;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  font-size:var(--t-label); letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim);
}
.fbar span{ white-space:nowrap }
.term{
  padding:15px 16px 17px;
  font:400 13px/1.62 var(--mono);
  color:var(--fg);
  overflow-x:auto;
}
.term p{ overflow-wrap:break-word }
.term > * + *{ margin-top:.32em }
.t-in{
  color:var(--fg-hi);
  padding-left:1.7ch; text-indent:-1.7ch;
}
.t-in .glyph{ color:var(--acc); font-weight:700; margin-right:.7ch }
.t-err{
  color:var(--dim);
  border-left:1px solid var(--line);
  padding-left:1.1ch;
}

.nf-links{
  margin-top: clamp(24px, 3.4vh, 38px);
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:1.2rem 2.5ch;
}
.nf-links a{ font-size:var(--t-small); font-weight:500 }

/* ---------- footer (matches home) ---------- */

.site-foot{ border-top:1px solid var(--hair) }
.site-foot .wrap{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:1.5rem; flex-wrap:wrap;
  padding-top:26px; padding-bottom:44px;
  font-size: 0.82rem; color:var(--dim);
}
.site-foot .src{ letter-spacing:.08em }

/* ============================================================
   MOBILE <= 740px
   ============================================================ */

@media (max-width:740px){
  body{ font-size:14px }
  .site-head .wrap{
    height:auto; flex-direction:column; align-items:flex-start;
    gap:9px; padding-top:12px; padding-bottom:12px;
  }
  .site-nav{ flex-wrap:wrap; gap:.5rem 1.1rem }
  .site-nav a{ font-size: 0.82rem }

  main section{ padding: clamp(40px, 6vh, 64px) 0 }
  .nf-line{ font-size:1rem }
  .term{ padding:13px 13px 15px }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation:none !important;
    transition:none !important;
  }
  .skip{ transition:none }
}
</style>
</head>
<body id="top">

<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/"><span class="tilde">~/</span>jnl</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/#whoami">whoami</a>
      <a href="/#projects">projects</a>
      <a href="/#ctf">ctf.log</a>
      <a href="/#academics">academics</a>
      <a href="/writing">writing</a>
      <a href="/cv">cv</a>
      <a href="/#contact">contact</a>
    </nav>
  </div>
</header>

<main id="main">
  <section aria-labelledby="h-404">
    <div class="wrap">
      <div class="nf">
        <h1 id="h-404" class="sr">404, page not found</h1>

        <svg class="nf-num" viewBox="0 0 300 148" fill="none" stroke="currentColor"
             stroke-width="15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M70 16 V132 M70 16 L14 90 H86"/>
          <ellipse cx="150" cy="74" rx="34" ry="58"/>
          <path d="M270 16 V132 M270 16 L214 90 H286"/>
        </svg>

        <p class="nf-line">That path is not part of the dossier.</p>

        <figure class="fig">
          <div class="frame">
            <p class="fbar" aria-hidden="true"><span>shell</span><span>nordheimlarssen.no</span></p>
            <div class="term" role="group" aria-label="A shell reading the requested path">
              <p class="t-in"><span class="glyph" aria-hidden="true">$</span>cat ~/jnl/resume</p>
              <p class="t-err">cat: ~/jnl/resume: No such file or directory</p>
            </div>
          </div>
        </figure>

        <nav class="nf-links" aria-label="Back to the site">
          <a href="/">home</a>
          <a href="/writing">writing</a>
          <a href="/cv">cv</a>
        </nav>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>© 2026 Joakim Nordheim Larssen</p>
    <p class="src">no JavaScript, no analytics</p>
  </div>
</footer>

</body>
</html>
